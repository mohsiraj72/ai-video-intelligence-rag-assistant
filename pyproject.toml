[project]
name = "ai-video-intelligence-rag-assistant"
version = "0.1.0"
description = "AI Video Intelligence and RAG Assistant for video transcription, summarization, insight extraction, and conversational search."
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
# Audio / Video
"yt-dlp>=2025.1.0",
"pydub>=0.25.1",

# Speech-to-Text
"openai-whisper>=20231117",
"torch>=2.2.0",
"torchaudio>=2.2.0",

# LangChain + Mistral
"langchain>=0.3.0",
"langchain-core>=0.3.0",
"langchain-community>=0.3.0",
"langchain-text-splitters>=0.3.0",
"langchain-mistralai>=0.2.0",
"mistralai>=1.0.0",

# RAG
"chromadb>=0.5.0",
"langchain-chroma>=0.2.0",
"sentence-transformers>=3.0.0",
"langchain-huggingface>=0.1.0",
"huggingface-hub>=0.23.0",
"tiktoken>=0.7.0",

# Streamlit
"streamlit>=1.35.0",
"streamlit-extras>=0.4.0",
"watchdog>=4.0.0",

# Utilities
"python-dotenv>=1.0.0",
"numpy>=1.26.0",
"tqdm>=4.66.0",
"requests>=2.32.0",

# PDF Export
"reportlab>=4.2.0",
]

[project.scripts]
ai-video-assistance = "app:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
