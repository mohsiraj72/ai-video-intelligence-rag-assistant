[project]
name = "ai-video-intelligence-rag-assistant"
version = "0.1.0"
description = "AI Video Intelligence and RAG Assistant for transcription, summarization, and RAG-based video question answering."
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "yt-dlp>=2025.1.0",
    "pydub>=0.25.1",
    "openai-whisper>=20231117",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-mistralai>=0.2.0",
    "mistralai>=1.0.0",
    "chromadb>=0.5.0",
    "langchain-chroma>=0.2.0",
    "sentence-transformers>=3.0.0",
    "langchain-huggingface>=0.1.0",
    "huggingface-hub>=0.23.0",
    "tiktoken>=0.7.0",
    "streamlit>=1.35.0",
    "streamlit-extras>=0.4.0",
    "watchdog>=4.0.0",
    "reportlab>=4.2.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "requests>=2.32.0",
    "torchvision>=0.29.0",
]
